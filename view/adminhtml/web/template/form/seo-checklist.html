<div class="softaware-seo">
    <div class="softaware-seo-score">
        <div class="softaware-seo-score-value" data-bind="css: scoreClass(), text: score()"></div>
        <div class="softaware-seo-score-text">
            <strong data-bind="i18n: 'SEO score'"></strong>
            <small data-bind="i18n: 'Updates as you type. Saved with the post and shown in the posts grid. These are guidelines, not rules.'"></small>
        </div>
    </div>
    <ul class="softaware-seo-list" aria-live="polite" data-bind="foreach: {data: checks(), as: 'check'}">
        <li data-bind="css: '_' + check.status">
            <span class="softaware-seo-status" data-bind="text: $parent.statusLabel(check.status) + ': '"></span>
            <span data-bind="text: check.message"></span>
        </li>
    </ul>
</div>
